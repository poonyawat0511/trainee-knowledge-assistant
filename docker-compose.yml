# docker-compose.yml
services:
  app:
    build: .
    # Pin to the host's native arch. Without this, Docker Desktop on Apple
    # Silicon can pull/build an amd64 image and run it under QEMU emulation,
    # which is a known cause of native Node addons (like better-sqlite3)
    # segfaulting despite building "successfully".
    platform: linux/arm64
    ports:
      - "3000:3000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PATH=/app/data/app.db
    volumes:
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
